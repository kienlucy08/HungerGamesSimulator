<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE 25TH QUARTER QUELL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22%23120a06%22/><path d=%22M16 3c2 6 8 8 8 15a8 8 0 0 1-16 0c0-4 3-5 3-9 2 1 3 3 3 5 1-4 2-7 2-11z%22 fill=%22%23ff6a1a%22/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="fire" aria-hidden="true"></canvas>
  <div class="fire-glow" aria-hidden="true"></div>

  <button class="btn present-toggle" id="btnPresent" title="Fullscreen with bigger text (F)">Presentation mode</button>


  <header class="site-header">
    <h1>THE 25TH QUARTER QUELL</h1>
    <p class="tagline">May the odds be ever in your favor</p>
  </header>

  <div class="audio-bar">
    <button class="btn" id="btnFire" title="Fire a cannon (C)">Fire cannon</button>
    <button class="btn" id="btnSound">Cannon sound: on</button>
    <button class="btn" id="btnMusic">Music: on</button>
    <label class="vol">Volume <input type="range" id="musicVol" min="0" max="100" value="35"></label>
    <button class="btn ghost" id="btnLoadMusic">Load music</button>
    <input type="file" id="musicFile" accept="audio/*" hidden>
  </div>

  <!-- ============ REAPING ============ -->
  <main id="screen-reaping" class="screen">
    <div class="toolbar">
      <button class="btn" id="btnSample">Fill sample names</button>
      <button class="btn" id="btnBulk">Bulk add photos</button>
      <button class="btn ghost" id="btnClear">Clear all</button>
      <input type="file" id="bulkFile" accept="image/*" multiple hidden>
    </div>
    <p class="hint">
      Click a portrait to upload a picture and type each tribute's name. "Bulk add photos" fills empty slots
      in order and uses the file names as names. Everything is saved in your browser.
    </p>
    <div id="districts" class="districts"></div>
    <div class="start-row">
      <p id="startMsg" class="start-msg"></p>
      <button class="btn big" id="btnStart">Begin the Games</button>
    </div>
  </main>

  <!-- ============ ARENA (slideshow) ============ -->
  <main id="screen-arena" class="screen" hidden>
    <div class="status-bar">
      <span id="statusDay">The Reaping</span>
      <span id="statusAlive"></span>
    </div>
    <div id="stage" class="stage" aria-live="polite"></div>
    <div class="controls">
      <button class="btn" id="btnPrev">Back</button>
      <button class="btn big" id="btnNext">Next</button>
      <button class="btn" id="btnAuto">Auto-play</button>
      <button class="btn" id="btnSkip">Skip to winner</button>
      <button class="btn ghost" id="btnBack">Edit tributes</button>
    </div>
  </main>

  <script src="audio/cannon.js"></script>
  <script src="js/events.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
